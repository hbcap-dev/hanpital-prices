name: 한피탈 시세 수집

on:
  schedule:
    # UTC 21:40 (일~목) = 한국시간 06:40 (월~금). 깃허브 예약 실행은 지연될 수 있어 브리핑(08:22)보다 일찍 돈다.
    - cron: "40 21 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-commit
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install pykrx yfinance finance-datareader requests pandas lxml html5lib beautifulsoup4

      - name: Fetch prices
        run: python fetch_prices.py
        env:
          HP_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Fetch DART disclosures
        run: python dart.py
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}

      - name: Fetch Naver research list
        run: python research.py
        continue-on-error: true

      - name: Fetch US macro (FRED)
        run: python macro.py
        continue-on-error: true

      - name: Commit prices.json
        run: |
          git config user.name "hanpital-bot"
          git config user.email "hanpital-bot@users.noreply.github.com"
          git add prices.json universe.json; for f in disclosures.json research.json macro.json; do [ -f $f ] && git add $f; done
          git diff --cached --quiet || git commit -m "시세 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
