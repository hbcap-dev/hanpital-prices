name: 한피탈 장중 시세

on:
  schedule:
    # UTC 00:00~06:50 (월~금) = 한국시간 09:00~15:50 10분마다. 대시보드 새로고침 버튼이 이 파일을 읽는다. 예약 실행은 몇 분 밀릴 수 있다.
    - cron: "*/10 0-6 * * 1-5"
    # 장 마감 직후 한 번 더 (UTC 06:40 = 한국시간 15:40) → 장 마감 정리용 종가
    - cron: "40 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-commit
  cancel-in-progress: false

jobs:
  intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install yfinance requests pandas

      - name: Fetch intraday
        run: python intraday.py
        env:
          HP_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Telegram alerts
        run: python alert.py
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEST: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

      - name: Commit intraday.json
        run: |
          git config user.name "hanpital-bot"
          git config user.email "hanpital-bot@users.noreply.github.com"
          git add intraday.json; [ -f alert_state.json ] && git add alert_state.json
          git diff --cached --quiet && exit 0
          git commit -m "장중 시세 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
