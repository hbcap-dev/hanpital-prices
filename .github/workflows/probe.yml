name: probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
concurrency: { group: repo-commit, cancel-in-progress: false }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q playwright && python -m playwright install --with-deps chromium
      - run: python probe_research.py
      - run: |
          git config user.name "hanpital-bot"; git config user.email "hanpital-bot@users.noreply.github.com"
          git add probe.json && git commit -qm probe && git pull --rebase -q && git push
